<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- ---HEADER--- -->
    <header class="header">
      <div class="container">
        <nav class="nav">
          <a href="" class="logo">

      </div>
    </header>
    <!-- ---HERO SECTION--- -->
    <section class="hero">
      <div class="container">
        <h1 class="hero-title"></h1>
        <p class="hero-text"></p>
        <button type="button" class="get-started-btn"></button
        ><img src="" alt="" class="hero-img" />
      </div>
    </section>
    <!-- ---STATS SECTION--- -->
    <section class="stats">
      <div class="container">
        <div class="wrapper">
          <svg class="stats-svg"></svg>
          <p class="stats-num"></p>
          <p class="stats-text"></p>

          <p class="stats-text"></p>

      </div>

    <!-- ---FEATURES SECTION--- -->
    <section class="features">
      <div class="container">
        <img src="" alt="" class="features-img" />
        <h2 class="features-title"></h2>
        <p class="features-text"></p>
        <ul class="features-list">
          <li class="features-item">
            <svg class="features-svg"></svg>
            <p class="features-list-text"></p>

        <h2 class="plan-title"></h2>
        <p class="plan-text"></p>
        <ul class="plan-list">
          <li class="plan-list-item">
            <img src="" alt="" class="plan-img" />
            <h3 class="plan-subtitle"></h3>
            <ul class="plan-features-list">
              <li class="plan-features-item">
                <svg class="plan-features-svg"></svg>
                <p class="plan-features-text"></p>
              </li>
            </ul>

            <p class="plan-list-select"></p>

          <li class="plan-list-item">
            <img src="" alt="" class="plan-img" />

              </li>

            <p class="plan-list-select"></p>

    <!-- ---SECTION CUSTOMER--- -->
    <section class="customer">

        <h2 class="customer-title"></h2>
        <p class="customer-text"></p>
        <ul class="customer-list">
          <li class="customer-item">
            <img src="" alt="" class="customer-img" />

            <p class="customer-location"></p>
            <p class="customer-point"></p>
            <svg class="customer-svg"></svg>
            <p class="customer-review"></p>

          <li class="customer-item">
            <img src="" alt="" class="customer-img" />

            <svg class="customer-svg"></svg>

        <button class="customer-btn-right" type="button"></button>

    <section class="subscribe">
      <div class="container">
        <h2 class="subscribe-title"></h2>
        <p class="subscribe-text"></p>
        <button type="button" class="subscribe-btn"></button>

        <div class="wrapper">

            <h3 class="footer-list-title"></h3>
            <ul class="footer-listsublist">

              <li class="footer-sublist-item"></li>
